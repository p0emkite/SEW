})(html,{"musou_001":["잡담은 이쯤 하지. 그래도 네 이야기는 제법 들을 만했어.","네 녀석과는 말이 잘 통하는군. 다음엔 술이나 한잔하지.","좋아. 네가 가려는 길, 내 검으로 열어 주지.","아직은 네 각오를 믿을 수 없다. 물러가라."],"musou_002":["오, 나한테 볼일인가? 어려운 이야기는 잘 모르지만 들어 주지!","하하! 너랑 있으면 마음이 편해. 언제든 찾아오라고!","좋아! 네가 위험할 땐 내가 앞에 서마!","미안하지만 아직 지켜야 할 약속이 있어서 말이지."],"musou_003":["무예뿐 아니라 마음을 단련하는 일도 중요하오. 좋은 담소였소.","그대의 뜻을 들으니 무인의 길을 다시 돌아보게 되는군.","그대의 대의에 이 무예를 바치겠소.","뜻은 알겠으나 아직 내 무를 맡길 때는 아니오."],"musou_004":["흥미롭군. 그대는 이 난세에서 무엇을 이루고자 하는가?","그대와의 담론은 늘 새로운 생각을 불러일으키는군.","좋다. 그대의 그릇이 어디까지인지 직접 확인해 보겠다.","나를 움직이려면 그만한 포부부터 보여야 할 것이다."],"musou_005":["어라, 나한테 온 거야? 배고프면 같이 먹자!","헤헤, 너랑 이야기하니까 밥도 더 맛있는 것 같아.","응! 내가 힘껏 도와줄게. 든든할 거야!","음… 아직은 잘 모르겠어. 조금 더 생각해 볼래."],"musou_006":["이야, 그거 재미있군! 너무 심각한 얼굴은 하지 말라고.","자네랑 한잔하다 보면 하루가 금방 가겠어!","좋아, 맡겨 둬! 내가 길을 시원하게 뚫어 주지.","하하, 제안은 고맙지만 지금은 좀 곤란해."],"musou_007":["그대의 이야기를 들으니 수련에 대한 의욕이 솟는군.","우리 함께 더 높은 경지에 이르도록 정진합시다.","그대와 함께라면 무의 길을 더욱 깊이 탐구할 수 있겠소.","아직은 스스로를 더 단련해야 할 때라 생각하오."],"musou_008":["어머, 대화에도 이토록 아름다운 조화가 있다니!","그대와 나누는 시간은 마치 한 폭의 아름다운 그림 같군요.","좋아요. 우리 함께 난세에 찬란한 아름다움을 펼쳐 보죠!","아쉽지만 아직 그대의 뜻에서 충분한 아름다움을 찾지 못했어요."],"musou_009":["평온한 시간도 지켜 내야 비로소 의미가 있는 법이오.","그대와 담소를 나누니 마음의 짐이 조금 가벼워지는군.","기꺼이 함께하겠소. 소중한 이들을 지키는 데 힘을 보태리다.","지금은 내가 지켜야 할 곳을 떠날 수 없소."],"musou_010":["용건은 그것뿐인가? 뭐, 무료함을 달래기에는 나쁘지 않았군.","그대의 이야기라면 조금 더 들어 주어도 좋겠지.","좋다. 그대의 야망이 어느 정도인지 지켜보도록 하지.","그 정도의 말로 나를 움직일 수 있다고 생각했나?"],"musou_011":["후후, 제법 품위 있는 이야기를 하시는군요.","당신과 함께라면 무료한 오후도 우아하게 흘러가는군요.","좋아요. 그대가 펼칠 무대에 저도 함께하겠어요.","아쉽군요. 아직 제 마음을 사로잡기에는 부족해요."],"musou_012":["마음을 나누는 말은 한 편의 시와도 같네요.","당신과 나눈 이야기를 오래도록 기억하고 싶어요.","당신의 뜻을 따라 저도 평온한 세상을 찾고 싶어요.","조금 더 생각할 시간을 주시겠어요? 마음을 정리하고 싶어요."],"musou_013":["허허, 이런 세상에서 한가로이 담소를 나누는 것도 복이지.","자네와 있으면 번잡한 계산을 잠시 내려놓아도 되겠군.","뭐, 그쪽이 살아남기 좋은 길이라면 함께 가 보지.","아직은 어느 쪽이 안전할지 판단하기 어렵군."],"musou_014":["말보다는 행동으로 보여 주는 것이 내 방식이오.","그대의 한결같은 태도를 보니 더욱 믿음이 가는군.","한번 정한 길이라면 끝까지 가겠소. 내게 맡기시오.","신의를 가볍게 여길 수는 없소. 지금은 사양하리다."],"musou_015":["한가한 담소라니… 당신도 참 독특하군요.","이상하네요. 당신 앞에서는 잠시 마음을 놓을 수 있어요.","내가 이루려는 일에도 도움이 된다면 함께하겠어요.","아직 내게는 끝내야 할 일이 있어요. 물러나 주세요."],"musou_016":["후후, 복잡한 정세는 잠시 잊고 즐거운 이야기나 더 하지요.","당신과 함께하는 시간은 꽤 아깝지 않군요. 한잔 어떠세요?","재미있겠군요. 당신이 만들어 갈 세상을 가까이에서 보고 싶습니다.","아직은 결정하기 이르군요. 서두르면 재미가 없잖습니까?"],"musou_017":["저 같은 자에게도 말을 걸어 주시다니, 감사합니다!","당신 덕분에 전보다 조금 더 자신이 생긴 것 같습니다.","부족하지만 누구보다 먼저 달려가 힘을 보태겠습니다!","아직 제가 그 기대에 부응할 수 있을지 모르겠습니다."],"musou_018":["이런 날엔 괜히 좋은 일이 생길 것 같은 기분이 드는군.","자네랑 있으면 안 좋은 예감도 싹 사라지는 것 같아.","좋아, 이번엔 느낌이 좋군! 함께 가 보자고.","미안, 왠지 지금 결정하면 후회할 것 같은 예감이 들어."],"musou_019":["가벼운 담소에도 예의와 절도가 있어야 하는 법이오.","그대는 약속을 지키는 사람이군. 그 점은 높이 평가하오.","군율과 질서가 존중된다면 내 힘을 보태겠소.","아직 그대의 뜻에 확신이 서지 않으니 사양하겠소."],"musou_020":["백성이 편안히 살아갈 방법을 함께 논할 수 있어 기쁩니다.","그대와 이야기를 나누다 보면 바른 길에 대한 확신이 생깁니다.","그대의 뜻이 사람들을 평안하게 한다면 기꺼이 돕겠습니다.","아직 제가 추구하는 뜻과 같은 길인지 확신하기 어렵습니다."],"musou_021":["좋은 말씀 감사합니다. 저도 더 분발해야겠군요.","당신의 격려가 제게 큰 힘이 됩니다. 늘 감사하게 생각합니다.","기대에 어긋나지 않도록 최선을 다하겠습니다!","아직은 제 마음을 정할 시간이 조금 더 필요합니다."],"musou_022":["흥미로운 이야기네요. 그 발상, 작전에도 응용할 수 있겠어요.","당신과 이야기하면 자꾸 새로운 계책이 떠오릅니다.","좋습니다. 준비할 것이 많겠군요. 제 능력을 활용해 보시죠.","계산해 보니 아직 움직일 때는 아닌 것 같군요."],"musou_023":["그 말씀에는 나름의 이치가 있습니다. 조금 더 들어 보지요.","그대와는 많은 말을 하지 않아도 뜻이 통하는군요.","알겠습니다. 조용히 제 지략을 보태도록 하지요.","여러 사정을 좀 더 살펴본 뒤에 결정하겠습니다."],"musou_024":["흥미로운 담론이군. 이런 여유도 장수에게 필요한 법이지.","그대와의 대화는 좋은 곡을 듣는 듯 즐겁군.","좋다. 내 지략과 무예로 그대의 뜻을 이루는 데 힘을 보태지.","그대가 그리는 큰 그림을 좀 더 확인하고 싶군."],"musou_025":["그런 관점은 미처 생각하지 못했네요. 좋은 공부가 되었습니다.","당신과 이야기를 나누면 제 생각도 한층 깊어지는 것 같습니다.","제 부족한 지략이라도 도움이 된다면 기꺼이 함께하겠습니다.","좀 더 신중히 생각해 보고 싶습니다. 양해해 주세요."],"musou_026":["아하하! 그런 이야기라면 얼마든지 환영이야!","너랑 있으면 정말 답답할 틈이 없어. 다음엔 활도 쏘러 가자!","좋아! 나도 함께 뛰어들게. 얌전히 있으라는 말은 하지 마!","미안! 아직 내 마음이 가는 길이 따로 있거든."],"musou_027":["오, 제법 배짱 있는 이야기잖아? 마음에 드는데!","하하! 너랑은 술 한 사발 앞에 놓고 밤새 떠들 수 있겠어!","좋지! 신나게 한바탕 해 보자고!","에이, 아직은 영 신이 안 나는데? 다음에 다시 와!"],"musou_028":["젊은 기백이 느껴지는군. 좋은 이야기였네.","자네와 함께하면 이 난세에도 희망이 보이는 듯하군.","좋다. 백성이 편히 살 세상을 함께 열어 보세!","뜻은 높이 사지만 지금은 섣불리 약속할 수 없네."],"musou_029":["솔직한 말이 마음에 드는군. 무인은 그래야지.","자네라면 등을 맡겨도 되겠어. 앞으로도 잘 부탁하네.","좋아! 한번 약속한 이상 끝까지 함께하겠네.","아직 지켜야 할 도리가 있네. 이해해 주게."],"musou_030":["오늘 이야기에서 배운 것이 많소. 책에만 답이 있는 건 아니군.","그대와 의견을 나누다 보면 내 안목도 넓어지는 듯하오.","그대의 뜻을 실현하는 데 내가 익힌 것을 써 보겠소.","아직은 충분히 숙고해야겠소. 쉽게 결정할 일은 아니군."],"musou_031":["허허, 젊은이의 이야기를 들으니 나까지 기운이 나는구먼!","이 늙은이와도 잘 어울리는군. 기특한 사람이야!","좋다! 이 몸이 아직 쓸 만하다는 걸 보여 주마!","허허, 노장의 마음을 돌리려면 조금 더 공을 들여야겠네."],"musou_032":["…그래. 잘 들었다.","…네 말이라면 믿을 만하다.","…알았다. 함께 가지.","…아직은 아니다."],"musou_033":["뭐, 꽤 재미있는 이야기였어. 시간 낭비는 아니었네.","너랑 있으면 귀찮은 일도 잠깐 잊을 수 있겠어.","좋아, 함께해 줄게. 너무 기대하지는 말고.","글쎄, 지금은 그럴 기분이 아닌데."],"musou_034":["하하! 이야기를 듣고 있으니 몸이 근질근질한걸!","너랑은 뭐든 신나게 해낼 수 있을 것 같아!","좋아! 망설일 게 뭐 있어? 같이 크게 한판 벌여 보자!","아직은 내가 하고 싶은 일이 있어서 말이야!"],"musou_035":["그대의 이야기를 들으니 생각할 것이 많아지는군.","그대처럼 진심으로 이야기해 주는 사람이 있어 든든하네.","그대가 이루려는 뜻에 힘을 보태겠네. 함께 나아가세.","책임이 따르는 선택인 만큼 조금 더 생각하고 싶네."],"musou_036":["와아, 정말? 있잖아, 다음 이야기도 들려줘!","헤헤, 너랑 놀면 시간이 너무 빨리 가! 또 만나자!","좋아 좋아! 나도 같이 갈래! 재미있겠다!","으음, 아직은 좀 망설여져. 다음에 또 물어봐 줘!"],"musou_037":["이렇게 이야기를 나눌 수 있어서 정말 기뻐요.","당신과 있으면 마음이 편안해져요. 다음에도 찾아와 주세요.","저라도 도움이 된다면… 용기를 내서 함께할게요.","죄송해요. 아직은 마음의 준비가 되지 않았어요."],"musou_038":["담소도 훌륭하군. 때로는 달빛 아래 꽃을 보는 것만큼 좋소.","그대와 나눈 말은 오래도록 가슴에 남는 한 수의 시 같소.","이 몸의 힘을 바치겠소. 함께 아름다운 내일을 맞이합시다.","아직은 길을 떠날 때가 아니오. 이 마음을 이해해 주시오."],"musou_039":["좋은 이야기네요. 잠시나마 마음 편히 쉴 수 있었어요.","당신과의 시간은 참 소중해요. 무리하지 말고 또 찾아와요.","좋아요. 소중한 사람들을 지킬 수 있도록 제 힘을 보탤게요.","미안해요. 지금은 제가 해야 할 일이 남아 있어요."],"musou_040":["허허, 사람과 이야기를 나누는 것만큼 귀한 일도 없지.","그대와의 인연은 어떤 재물과도 바꿀 수 없겠군.","좋소. 그대의 큰 뜻을 위해 함께 힘을 모읍시다.","아직 서로의 뜻을 조금 더 알아 갈 필요가 있겠소."],"musou_041":["어, 나를 찾아온 건가? 하하, 내 이름을 기억해 줘서 고맙군!","자네만큼은 날 잊지 않는구먼. 정말 기쁜 일이야!","좋아! 이번에는 확실히 내 활약을 보여 주겠어!","으음, 나도 생각할 시간이 필요하다네. 잊지는 말아 줘!"],"musou_042":["오, 나한테도 그런 이야기를 해 주는 건가! 기운이 나는군!","그대 덕분에 내 열정이 더욱 활활 타오르는 것 같아!","좋다! 내 열의가 얼마나 뜨거운지 보여 주겠어!","아직은 불을 지필 때가 아닌 것 같군."],"musou_043":["그런 이야기를 들으니 옛날 일이 생각나는구먼.","젊은 사람과 마음을 나누는 일도 제법 즐겁군.","좋네. 이 노장의 경험이 필요한 곳에서 힘을 쓰도록 하지.","경험상 중요한 결정은 서두르지 않는 것이 좋네."],"musou_044":["좋은 기백이군! 그런 마음가짐이라면 더 크게 활약할 수 있겠어.","자네는 정말 믿음직한 사람이군. 함께라면 두려울 게 없어.","좋아! 내 힘으로 반드시 기대에 보답하지!","아직 그대의 각오를 조금 더 지켜보고 싶군."],"musou_045":["그대의 진심이 느껴지는 이야기였습니다.","당신과 이야기를 나누니 제 마음도 더욱 굳건해지는군요.","그대의 뜻을 믿겠습니다. 이 창으로 길을 열겠습니다.","죄송합니다. 아직 제가 따라야 할 길이 분명하지 않습니다."],"musou_046":["그대의 언행에서 신의의 뜻을 느낄 수 있었소.","그대와의 인연이라면 오래도록 소중히 간직할 것이오.","의리를 저버리지 않는 길이라면 기꺼이 함께하겠소.","의는 말로 맺는 것이 아니오. 좀 더 지켜보겠소."],"musou_047":["으하하! 거 참 재미있는 이야기로군! 술이라도 마실 텐가?","너처럼 시원시원한 녀석이랑 있으면 속이 다 뻥 뚫린다니까!","좋다! 이 장비가 앞장서 줄 테니 걱정 마라!","안 돼! 아직은 내가 마음을 정할 때가 아니란 말이다!"],"musou_048":["그대의 말씀에는 생각할 만한 대목이 있군요.","그대와 이야기를 나누면 천하의 흐름도 새롭게 보이는군요.","그대가 세우고자 하는 뜻에 제 지략을 보태겠습니다.","아직은 때가 무르익지 않았습니다. 조금 더 기다려 주시지요."],"musou_049":["그대와 이야기하니 사람의 마음이 얼마나 귀한지 다시 느끼는군.","그대와 같은 벗이 있다는 것만으로도 내게 큰 힘이 되네.","함께 백성들이 웃을 수 있는 세상을 만들어 보세.","그 마음은 고맙지만 아직 지켜야 할 인연이 있네."],"musou_050":["그대에게도 불의에 맞설 용기가 있군! 좋은 이야기였어.","자네와 함께라면 정의를 실현할 수 있으리라 믿는다!","좋아! 이 창으로 불의를 꿰뚫는 데 함께하겠다!","정의에 대한 그대의 뜻을 아직 더 확인하고 싶다!"],"musou_051":["허허! 이런 이야기를 듣고 있자니 아직 늙을 때가 아니구먼.","자네와는 오래도록 좋은 벗으로 지낼 수 있겠어.","좋다! 아직 이 활이 녹슬지 않았음을 보여 주마!","허허, 이 늙은이도 생각이 있으니 조금만 기다리게."],"musou_052":["…너, 말… 재미있다.","너… 믿는다. 또, 와라.","나… 너와, 간다. 싸운다!","아직… 안 간다. 내 길… 간다."],"musou_053":["좋은 말씀 감사합니다! 저도 더 노력해야겠습니다.","당신과 함께하면 훌륭한 무인이 될 수 있을 것 같습니다.","부친께 부끄럽지 않도록 온 힘을 다해 함께하겠습니다!","아직 제 마음을 정하지 못했습니다. 죄송합니다."],"musou_054":["허허, 겉으로 보이는 것과 속사정이 다른 법이지. 재미있군.","자네랑은 속 편히 이야기할 수 있어서 좋구먼.","그거 꽤 재미있겠는데? 내 머리도 좀 써 볼까.","글쎄, 아직 판이 어떻게 돌아갈지 모르겠는걸."],"musou_055":["흥미로운 생각이네요. 무언가 새로 만들어 보고 싶어졌어요.","당신과 함께 의견을 나누면 좋은 방안이 떠오르곤 해요.","좋아요. 제 지식과 기술이 도움이 된다면 기꺼이 함께할게요.","아직은 검토해야 할 일이 남아 있어요. 조금만 기다려 주세요."],"musou_056":["그대의 말씀을 듣고 나니 더욱 큰 뜻을 품게 되는군요!","당신과 이야기할 때면 제가 나아가야 할 길이 또렷해집니다.","저도 함께하겠습니다! 품은 뜻을 반드시 이뤄 보이겠습니다!","아직 제가 이어 가야 할 뜻과 같은 길인지 생각해 보겠습니다."],"musou_057":["음, 그렇게 생각하시는군요. 덕분에 편안한 시간이었습니다.","당신과 이야기하면 마음의 여유를 찾을 수 있는 것 같군요.","그대와 함께라면 새로운 길도 괜찮을 듯합니다.","서두르지 않고 조금 더 생각해 보고 싶군요."],"musou_058":["이야기 잘 들었어. 그런 생각도 나쁘지 않네.","네가 어떤 사람인지 조금은 알 것 같아. 다음에도 이야기하자.","좋아. 해야 할 일이 분명하다면 나도 함께할게.","미안하지만 아직 네 뜻을 전부 믿기는 어려워."],"musou_059":["이야, 그거 재미있네! 너무 진지하게만 생각하진 말라고!","너랑 있으면 마음이 참 가벼워져. 이 기분, 오래 가면 좋겠네!","좋아! 내가 분위기도 살리고 힘도 보태 줄게!","미안 미안! 아직은 선뜻 답하기가 어렵네."],"musou_060":["그런 말씀을 들으니 제 마음도 한결 밝아지는군요.","당신과의 인연에 감사하고 있습니다. 또 이야기하고 싶네요.","기꺼이 함께하겠습니다. 제 힘이 도움이 되기를 바랍니다.","죄송합니다. 아직 제 마음을 조금 더 살펴보고 싶습니다."],"musou_061":["오! 그런 얘기 좋지! 나도 한마디 해도 돼?","너랑 같이 있으면 기분이 완전 좋아! 다음에도 놀자!","좋았어! 나도 끼워 줘! 누구보다 씩씩하게 해낼게!","아직은 별로 내키지 않네. 미안! 다음에 다시 얘기하자!"],"musou_062":["아… 제 이야기를 들어 주셔서 감사합니다. 별것 아닌데 말이죠.","당신 앞에서는 조금 더 자신 있게 말할 수 있는 것 같습니다.","저 같은 사람도 괜찮다면… 용기를 내어 함께하겠습니다.","아직 제 자신에게 확신이 없습니다. 죄송합니다."],"musou_063":["그래. 좋은 이야기였어. 생각할 거리가 늘었군.","너와 이야기할 때는 복잡한 고민도 조금 가벼워지는 것 같아.","좋아. 네 뜻을 믿고 내 검을 맡기지.","지금은 아직 결정을 내릴 수 없어."],"musou_064":["오! 그런 이야기라면 나도 좋아하지! 더 들려줘!","너처럼 믿음직한 녀석과 함께하면 기운이 솟는다고!","좋아! 나도 앞장설 테니까 함께 달려 보자!","아직은 좀 아닌 것 같아. 마음은 고마워!"],"musou_065":["우와, 정말요? 헤헤, 이야기하다 보니 시간이 훌쩍 갔네요!","당신과 이야기하면 저도 모르게 힘이 나요! 다음에도 꼭 와 주세요!","좋아요! 제가 힘쓰는 일은 자신 있거든요. 같이 열심히 해요!","으음… 아직은 조금 고민돼요. 그래도 찾아와 줘서 고마워요!"],"musou_066":["흥미롭군. 은혜도 원한도 잊지 않는 것이 내 방식이네.","자네에게 받은 호의는 언젠가 반드시 갚도록 하지.","좋다. 자네의 성의에 그만한 보답을 해 주겠어.","아직은 그대에게 내 능력을 내줄 만한 이유가 없군."],"musou_067":["오오! 그런 말씀을 들으니 힘이 솟습니다! 당장 달리고 싶군요!","당신과 함께라면 백 리라도 단숨에 달릴 수 있겠습니다!","좋습니다! 제 발과 힘을 마음껏 써 주십시오!","죄송합니다! 아직 제가 달려가야 할 곳이 따로 있습니다!"],"musou_068":["이렇게 찾아와 주시다니… 고마워요. 조금 긴장했어요.","당신과 이야기하면 안심이 돼요. 다음에도 함께 이야기해요.","조금 떨리지만… 저도 함께 용기를 내 볼게요.","미안해요. 아직은 생각할 시간이 조금 더 필요해요."],"musou_069":["흥, 그 정도 생각은 했나. 그나마 무료하지는 않군.","후후, 그대와 말을 섞는 일이 생각보다 즐겁군. 인정해 주지.","좋다. 그대의 판단이 틀리지 않았음을 내 계책으로 증명해 주마.","나를 움직이기엔 아직 한참 모자라는군."],"musou_070":["나쁘지 않은 이야기군. 그대의 생각을 기억해 두지.","그대와 의견을 나누는 것은 내게도 의미 있는 시간이군.","좋다. 우리의 뜻이 같다면 주저할 이유는 없겠지.","아직은 그대의 결단을 신뢰하기 어렵군."],"musou_071":["이야, 그렇게 복잡하게 생각하면 피곤하지 않아?","너랑 이야기하면 귀찮은 일도 조금 덜 귀찮아지는 것 같네.","뭐, 어쩔 수 없지. 함께 재미있는 일을 만들어 보자고.","아직은 좀 귀찮은데… 다음에 다시 이야기하지 않을래?"],"musou_072":["현장을 잘 살펴보는 것이 중요합니다. 그 말씀은 참고하겠습니다.","당신과 의견을 나누니 새로운 길이 보이는 것 같군요.","알겠습니다. 누구보다 성실하게 맡은 일을 수행하겠습니다.","아직 상황을 더 살펴볼 필요가 있습니다. 양해 바랍니다."],"musou_073":["그렇군요. 말에 책임을 질 수 있다면 좋은 생각이라고 봐요.","당신은 생각보다 믿음직하네요. 조금 더 이야기해도 좋겠어요.","좋아요. 제 몫의 일을 확실히 해내겠어요.","그 제안에는 아직 부족한 부분이 있어요. 좀 더 생각해 보세요."],"musou_074":["제법 재미있는 관점이군. 물론 내 생각만큼은 아니지만!","나와 이렇게 말이 통하는 사람도 드물지. 영광으로 알게!","좋다! 이 천재의 재능을 빌릴 기회를 주도록 하지!","하! 그 정도로 이 종회를 움직일 수 있을 것 같나?"],"musou_075":["그대의 의견에도 일리가 있소. 질서와 명분을 잊지 맙시다.","그대의 성실함은 높이 평가하고 있소. 앞으로도 변함없기를 바라오.","명분이 분명하다면 나도 마땅히 힘을 보태겠소.","그대가 따르는 원칙을 조금 더 확인할 필요가 있소."],"musou_076":["하하, 그렇게 무거운 얘기만 하면 어깨 결린다고!","너랑 있으면 괜한 걱정도 줄어드는 것 같아. 고맙다!","좋아! 너무 심각해지지 않는 선에서 힘껏 도와줄게!","미안, 지금은 이래저래 고민이 좀 있어서 말이야."],"musou_077":["크흠… 좋은 담소였습니다. 덕분에 기운이 조금 나는군요.","콜록… 당신의 배려가 제게 큰 힘이 됩니다.","이 몸이 허락하는 한 끝까지 힘을 보태겠습니다.","죄송합니다. 아직은 몸과 마음을 추스를 시간이 필요합니다."],"musou_078":["쓸데없는 미사여구는 필요 없지. 하지만 그 말은 기억하겠다.","네 앞에서는 굳이 생각을 숨길 필요가 없을 것 같군.","좋아. 필요하다면 뒤에서 처리해야 할 일도 맡지.","아직은 네가 그만한 결단을 내릴 사람인지 모르겠군."],"musou_079":["좋은 말씀입니다! 저 역시 더 용기를 내어야겠습니다.","그대와 이야기하면 어떤 어려움에도 맞설 힘이 생깁니다!","함께하겠습니다! 이 창에 부끄럽지 않게 싸우겠습니다!","아직은 제 결심이 부족합니다. 조금 더 시간을 주십시오."],"musou_080":["어머, 꽤 재미있는 이야기를 해 주시는군요.","후후, 당신과 있으면 마음 편히 웃을 수 있겠어요.","좋아요. 제가 함께하면 한결 든든하실 거예요.","후후, 아직은 제 마음을 움직이기에 부족하군요."],"musou_081":["그렇군요. 그런 생각도 충분히 일리가 있는 것 같아요.","당신과 이야기를 나누면 복잡한 일도 한결 명확해지네요.","좋아요. 제가 아는 것들이 도움이 될 수 있다면 함께할게요.","중요한 결정이니까요. 조금 더 차분히 생각해 보고 싶어요."],"musou_082":["이렇게 평온하게 이야기를 나누니 마음이 놓이는군요.","당신 앞에서는 잠시 모든 근심을 내려놓을 수 있을 것 같아요.","저도 함께할게요. 그 뜻이 더 많은 사람의 평온으로 이어지기를 바라요.","죄송해요. 아직 제 마음을 온전히 맡기기에는 어려움이 있어요."],"musou_083":["쓸데없는 말은 됐다. 네놈의 이야기는 그래도 지루하진 않군.","흥, 네놈과 이야기하는 건 제법 마음에 든다.","좋다! 내가 나서면 천하에 막을 자는 없을 것이다!","나를 부릴 생각이라면 힘부터 증명해라!"],"musou_084":["크하하! 나를 즐겁게 해 주는 이야기는 얼마든지 환영이다!","네놈과는 제법 흥이 나는군. 다음엔 술과 진수성찬을 준비해라!","좋다! 풍족한 즐거움을 누릴 수 있다면 내 힘을 빌려 주지!","흥, 그 정도로는 이 몸의 만족을 채울 수 없지!"],"musou_085":["이 몸에게 어울리는 고상한 이야기로군. 계속하게.","자네는 명문에 걸맞은 예의를 아는군. 아주 흡족하네!","좋다! 이 원소의 명성이 그대에게 힘이 되어 주리라!","명문 원가의 일원을 쉽게 움직일 수 있다고 생각하지 말게!"],"musou_086":["오오, 그대의 이야기에도 새로운 세상을 향한 빛이 깃들어 있구려!","그대와 마음을 나누니 천하에 희망의 기운이 차오르는구려!","좋소! 백성들을 밝은 미래로 이끄는 길을 함께 걸읍시다!","아직은 그대가 하늘의 뜻과 같은 길을 걷는지 모르겠구려."],"musou_087":["우하하! 거 재미있는 소리다! 더 말해 봐라!","너랑 있으면 호탕하게 웃을 일이 많아서 좋구나!","좋다! 남중의 힘이 얼마나 대단한지 보여 주마!","아직은 마음이 안 움직인다! 다음에 다시 와라!"],"musou_088":["하하! 제법 속이 시원해지는 이야기를 하는걸!","너랑 이야기하면 가슴이 뜨거워져. 그 기백, 잊지 마!","좋아! 내가 화끈하게 힘을 보태 줄 테니 잘 따라와!","아직은 내 마음에 불이 붙지 않았어. 다음에 보자!"],"musou_089":["허허, 그대의 말에도 보이지 않는 인연의 이치가 있군.","그대와의 만남 역시 하늘이 맺어 준 귀한 인연이겠지.","좋네. 그대가 걸어갈 길을 곁에서 지켜보도록 하지.","아직은 인연이 무르익을 때가 아닌 듯하네."],"musou_090":["오호, 꽤 흥미로운 이야기를 하는군! 좀 더 들어 보세.","자네는 내 계책의 진가를 알아주는 드문 사람이야!","좋네! 내 계략이 천하를 놀라게 할 기회를 드디어 얻었군!","아직은 내 지략을 제대로 펼칠 수 있을지 의문이군."],"musou_091":["그런 이야기도 나쁘지 않군. 잠시 긴장을 풀 수 있었어.","너와 있을 때는 강해져야 한다는 부담을 조금 내려놓을 수 있어.","좋아. 내 힘이 필요한 곳이라면 나도 함께하겠어.","아직 내 길은 내가 정하고 싶어. 조금 더 생각할게."],"musou_092":["흠, 이 몸에게 올리는 이야기치고는 꽤 들을 만하구나.","자네는 고귀한 이 몸을 대하는 법을 제법 잘 아는군!","좋다! 이 원술과 함께하는 영광을 누리도록 하라!","그 정도 대우로는 나의 고귀함에 걸맞지 않다!"],"musou_093":["뭐야, 또 나한테 온 거야? 심심하던 참이니까 들어 줄게.","흥, 너랑 놀면 그나마 지루하지 않네. 또 와도 좋아.","좋아, 같이 가 줄게. 대신 나를 심심하게 하면 안 돼!","싫어! 아직 내가 재미있을 것 같지가 않잖아!"],"musou_094":["하하! 그런 배짱이라면 나도 인정하지!","자네와 이야기하니 이 몸의 힘을 더 보여 주고 싶어지는군!","좋다! 내가 앞장서면 어떤 적도 두려울 게 없다!","아직은 내 힘을 맡길 만한 기개가 부족하군."]});
  document.open();document.write(html);document.close();
 }catch(error){status.textContent='불러오기 실패: '+error.message;document.getElementById('retry').hidden=false;}
})();
