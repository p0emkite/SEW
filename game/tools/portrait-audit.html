const jp=u=>u?.replace('https://www.koeitecmoamerica.com/dw9/','https://www.gamecity.ne.jp/smusou8/');
const paths=r=>[jp(r.full),r.full,jp(r.portrait),r.portrait,jp(r.casual),r.casual].filter(Boolean);
let done=0,ok=0,failed=[],cursor=0;
function probe(url){return new Promise(resolve=>{const i=new Image();let settled=false;const finish=(v)=>{if(settled)return;settled=true;clearTimeout(timer);i.onload=i.onerror=null;resolve(v)};const timer=setTimeout(()=>finish(null),5000);i.referrerPolicy='no-referrer';i.onload=()=>finish(i.naturalWidth?i:null);i.onerror=()=>finish(null);i.src=url})}
async function worker(){while(cursor<roster.length){const r=roster[cursor++],card=document.getElementById(r.id),status=card.querySelector('small');let img=null;for(const url of paths(r)){img=await probe(url);if(img)break;}if(img){img.alt=r.name;card.prepend(img);status.textContent='성공 · '+img.naturalWidth+' × '+img.naturalHeight+' · '+new URL(img.src).hostname;status.className='ok';ok++;}else{status.textContent='실패 · 공식 URL 모두 미표시';status.className='bad';failed.push(r.name);}done++;document.getElementById('summary').textContent=done+' / '+roster.length+' · 성공 '+ok+' · 실패 '+failed.length+(failed.length?' ('+failed.join(', ')+')':'');}}
for(const r of roster){const div=document.createElement('div');div.className='card';div.id=r.id;const b=document.createElement('b');b.textContent=r.name;const sm=document.createElement('small');sm.textContent='확인 중';div.append(b,sm);document.getElementById('grid').append(div)}
Promise.all(Array.from({length:12},worker)).then(()=>{document.getElementById('summary').dataset.complete='true';});
